# Overlay del NUC de Learning Center (2026-08-21).
#
# Este archivo NO se usa en la ventana ni en HAL local. Hace seis cosas:
#   1. Saca a El Portero del stack (Caddy vive en la ventana).
#   2. Publica los puertos que la ventana consume por el tailnet.
#   3. Sube el tuning de Postgres y Redis, que en el compose base está calibrado
#      para el droplet de 1 GB.
#   4. Pone `restart: always`, el segundo candado del arranque tras un apagón.
#   5. Levanta El Mostrador, que entrega los medios de El Almacén desde el disco
#      de esta máquina (el disco está aquí; El Portero está en la ventana).
#   6. Le sube el fierro a gunicorn y a Postgres para lo que esta máquina da de
#      verdad: 8 núcleos y 15 G, contra el default del repo, que está calibrado
#      para el droplet de 1 GB (1 worker, shared_buffers=64MB).
services:
  el-portero:
    # Un profile que nadie activa = servicio que no se levanta, sin borrarlo del
    # compose base (así el mismo repo sigue sirviendo en el droplet y en HAL).
    profiles: ["solo-en-la-ventana"]

  # ── Los puertos que consume la ventana ──────────────────────────────────────
  # Se publican en 0.0.0.0 A PROPÓSITO: si se bindearan a la IP del tailnet y
  # tailscaled no ha subido cuando Docker arranca, el contenedor NO arranca. Lo
  # que cierra la puerta hacia la LAN es ufw (allow in on tailscale0).
  el-taller:
    ports:
      - "8200:8000"
    restart: always
    environment:
      # 8 × 4 = 32 peticiones a la vez. La cuenta que importa NO es la de CPU
      # —son 5 usuarios, nunca van a saturar 8 núcleos— sino la de ESPERAS: un
      # PDF que lo arma Google, una llamada a un Chalán o un OCR se llevan
      # segundos sin usar procesador, y cada uno ocupa un hilo. Con 32 hilos,
      # cinco personas pueden tener varias cosas lentas en vuelo y el sistema
      # sigue contestando al instante.
      #
      # Cuesta ~1.8 G de los 11 G libres. El techo real no es la RAM sino las
      # conexiones a Postgres: 32 (Taller) + 16 (Gerencia) + el worker = 49,
      # contra `max_connections=100`. Sobra el doble.
      GUNICORN_WORKERS: "8"
      GUNICORN_THREADS: "4"

  la-gerencia:
    ports:
      - "8201:8001"
    restart: always
    environment:
      # La Gerencia es panel de configuración y mueve menos tráfico que El
      # Taller, pero es la que corre El Vigía: cinco paneles pidiendo cada 2-30 s,
      # y algunos hablan con el socket de Docker o con internet. Con 2 workers,
      # un sondeo lento a DigitalOcean podía dejar la pared esperando.
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "4"

  # ── Postgres ────────────────────────────────────────────────────────────────
  # El compose base está tuneado para "droplet de 1 GB" (shared_buffers=64MB).
  # Esta máquina tiene 15 G y 8 núcleos, y el primer paso de la mudanza lo dejó a
  # medio camino (512 MB) por prudencia. Aquí ya va dimensionado de verdad:
  #
  #   shared_buffers 2G          el 13% de la RAM. La receta común es 25%, pero
  #                              esta máquina corre TODO (apps, Redis, Docker),
  #                              no es un servidor de base dedicado.
  #   effective_cache_size 8G    no reserva nada: le dice al planeador cuánta
  #                              memoria puede suponer que el sistema tiene en
  #                              caché. Subirlo hace que prefiera índices sobre
  #                              recorridos de tabla completos.
  #   work_mem 16M               por operación de orden/agrupado. Con 100
  #                              conexiones el peor caso teórico es alto, pero
  #                              las consultas del repo son chicas y ordenadas.
  #   random_page_cost 1.1       el default (4.0) asume disco que gira, donde
  #                              saltar es caro. Esto es SSD: saltar cuesta casi
  #                              lo mismo que leer seguido, y sin corregirlo el
  #                              planeador evita índices que sí conviene usar.
  #   effective_io_concurrency   un SSD atiende muchas lecturas a la vez; el
  #     200                      default (1) le dice que no puede.
  #   los max_parallel_*         dejan que UNA consulta grande use varios
  #                              núcleos. Es lo que aprovecha los 8 de verdad:
  #                              los reportes de Contaduría y los exports.
  postgres:
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=8GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_maintenance_workers=4"
    restart: always

  # ── Redis ───────────────────────────────────────────────────────────────────
  # El compose base pone techo de 64 MB con allkeys-lru "para que la cola del
  # Portavoz no crezca sin control". El efecto real es el contrario y es
  # peligroso: allkeys-lru puede desalojar la PROPIA cola (portavoz:cola no tiene
  # TTL), o sea perder eventos en silencio. Aquí: techo holgado y volatile-lru,
  # que solo desaloja lo que sí caduca (el caché de imágenes y las sesiones).
  redis:
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      # 2 G. El techo importa por El Almacén: cada foto de producto deja su
      # derivado en caché, y con 512 MB una tanda grande empezaba a desalojar.
      # Con esto la caché de medios cabe entera y las fotos salen del primer tiro.
      - "2gb"
      - "--maxmemory-policy"
      - "volatile-lru"
    restart: always

  portavoz-worker:
    restart: always

  # ── El Mostrador ────────────────────────────────────────────────────────────
  # El Almacén guarda los medios en disco; El Mostrador los entrega. Existe porque
  # la mudanza separó las dos cosas que el diseño original tenía juntas: el disco
  # quedó aquí y El Portero en la ventana, así que las fotos necesitaban alguien
  # que las sirviera DE ESTE LADO. La ventana le hace reverse_proxy por el tailnet
  # (`UPSTREAM_MEDIOS`) y deja a El Taller como respaldo, de modo que si este
  # contenedor se cae las fotos siguen saliendo, sólo que por Django.
  #
  # Sólo monta `pub/` (los derivados JPEG/PNG que generamos nosotros). `orig/`, que
  # es lo que sube la gente, NO se monta: ésa es la frontera de seguridad.
  el-mostrador:
    image: caddy:2-alpine
    container_name: despacho-el-mostrador
    restart: always
    volumes:
      - ./infra/mostrador/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/media/pub:/srv/medios:ro
    environment:
      UPSTREAM_TALLER: "el-taller:8000"
    ports:
      - "8202:80"
    # Con la bitácora encendida, techo al archivo: las fotos son las peticiones
    # más numerosas del sistema y esta máquina tiene UN disco.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Por qué `restart: always` y no el `unless-stopped` del compose base ───────
# TRAMPA PAGADA EL 2026-08-21: `unless-stopped` NO levanta un contenedor que el
# demonio de Docker cree "detenido a mano", y ese marcador se lo cuelga CUALQUIER
# `docker kill` — incluso uno que solo manda un HUP y no mata nada. `optimizar.sh`
# hacía `docker compose kill -s HUP` cada 3 días sobre La Gerencia y El Taller: los
# dos seguían corriendo, pero quedaban marcados, y tras un apagón el demonio
# restauraba los otros tres y decía "done" sin un solo error en el journal. El
# sitio quedaba abajo hasta que alguien corriera `up -d` a mano.
#
# La causa ya está arreglada en optimizar.sh (el HUP se manda desde dentro del
# contenedor). Esto es el segundo candado: en ESTA máquina el requisito es que el
# sitio vuelva solo tras un corte de luz, así que reinicia pase lo que pase.
#
# El precio: si paras un servicio a propósito y la máquina reinicia, vuelve. Para
# apagar algo de verdad se usa su profile (como La Recepción) o
# `docker update --restart=no <contenedor>`.
