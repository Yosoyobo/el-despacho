# Overlay del NUC de Learning Center (2026-08-21).
#
# Este archivo NO se usa en la ventana ni en HAL local. Hace seis cosas:
#   1. Saca a El Portero del stack (Caddy vive en la ventana).
#   2. Publica los puertos que la ventana consume por el tailnet.
#   3. Sube el tuning de Postgres y Redis, que en el compose base está calibrado
#      para el droplet de 1 GB.
#   4. Pone `restart: always`, el segundo candado del arranque tras un apagón.
#   5. Levanta El Mostrador, que entrega los medios de El Almacén desde el disco
#      de esta máquina (el disco está aquí; El Portero está en la ventana).
#   6. Le sube el fierro a gunicorn y a Postgres para lo que esta máquina da de
#      verdad: 8 núcleos y 15 G, contra el default del repo, que está calibrado
#      para el droplet de 1 GB (1 worker, shared_buffers=64MB).
#
# ── EL PRESUPUESTO DE MEMORIA (decisión de Oscar, 2026-08-22) ─────────────────
# La máquina tiene 14.8 G y el colchón intocable es de 4 G, así que hay ~10.8 G
# para repartir. Los números de abajo están dimensionados para que la base y el
# catálogo puedan crecer CIEN VECES sin que nadie tenga que volver a entrar a un
# servidor headless a cambiar una cifra. Eso es lo que se está comprando aquí, no
# velocidad de hoy: con 29 MB de base, subir cachés no acelera nada medible.
#
#   Postgres shared_buffers   4 G   techo; crece con la base
#   Postgres work_mem         ~0.8 G en el pico observado (25 consultas × 32 M)
#   12 workers de gunicorn    3.6 G  (8 del Taller + 4 de La Gerencia)
#   Redis                     3 G   techo; hoy usa 4.5 M
#   El Mostrador, El Portavoz, Docker  ~0.5 G
#   ─────────────────────────────────────────────────────────────
#   Uso real hoy              ~4.4 G      → 10.4 G disponibles
#   Peor caso realista        ~9.4 G      → 5.4 G de colchón
#
# Los techos NO son reservas: `shared_buffers` y el `maxmemory` de Redis se llenan
# según haga falta. Sumar todos los techos a la vez da un número que asusta y que
# no ocurre — y para el día en que se acerque está el aviso automático: El Vigía
# pinta la memoria en rojo y `/salud` lo reporta cuando el colchón baja de 4 G.
# **Si ese aviso aparece, ES la señal de volver aquí.** Mientras no aparezca, no
# hay nada que ajustar.
#
services:
  el-portero:
    # Un profile que nadie activa = servicio que no se levanta, sin borrarlo del
    # compose base (así el mismo repo sigue sirviendo en el droplet y en HAL).
    profiles: ["solo-en-la-ventana"]

  # ── Los puertos que consume la ventana ──────────────────────────────────────
  # Se publican en 0.0.0.0 A PROPÓSITO: si se bindearan a la IP del tailnet y
  # tailscaled no ha subido cuando Docker arranca, el contenedor NO arranca. Lo
  # que cierra la puerta hacia la LAN es ufw (allow in on tailscale0).
  el-taller:
    ports:
      - "8200:8000"
    restart: always
    environment:
      # 8 × 4 = 32 peticiones a la vez. La cuenta que importa NO es la de CPU
      # —son 5 usuarios, nunca van a saturar 8 núcleos— sino la de ESPERAS: un
      # PDF que lo arma Google, una llamada a un Chalán o un OCR se llevan
      # segundos sin usar procesador, y cada uno ocupa un hilo. Con 32 hilos,
      # cinco personas pueden tener varias cosas lentas en vuelo y el sistema
      # sigue contestando al instante.
      #
      # Cuesta ~1.8 G de los 11 G libres. El techo real no es la RAM sino las
      # conexiones a Postgres: 32 (Taller) + 16 (Gerencia) + el worker = 49,
      # contra `max_connections=100`. Sobra el doble.
      # El segundo mapa de OSRM (bicicleta). Va vacío mientras no esté cocido:
      # así `lib.ruteo` sabe que no existe y la pantalla de Ajustes → Rutas lo
      # dice en pantalla, en vez de medir en coche fingiendo que mide en bici.
      # El guion de despliegue la llena sola cuando encuentra el mapa.
      OSRM_URL_BICI: "${OSRM_URL_BICI:-}"
      GUNICORN_WORKERS: "8"
      # 8 × 8 = 64 peticiones a la vez. Los HILOS se duplican y los workers no,
      # porque el techo más bajo del sistema no es el CPU: son las esperas. Los
      # logs lo enseñan — `/chalan/nuevo` tarda 6.4 s y `/chalan/c/N/enviar` 4.5 s,
      # y ese tiempo NO gasta procesador (se está esperando a Anthropic o a
      # Deepseek) pero ocupa un hilo completo. Con 4 hilos por worker, 32 personas
      # pidiéndole algo al Chalán a la vez llenaban el cupo y la 33ª esperaba.
      #
      # Un hilo cuesta memoria de pila, no una copia de Django: los 32 nuevos
      # suman ~150 MB, contra los ~230 MB que cuesta UN worker más. Y más workers
      # no darían nada: el CPU ya se satura a 275 peticiones/segundo.
      GUNICORN_THREADS: "8"
      # `MALLOC_ARENA_MAX=2` viene del compose base, donde la RAM era el recurso
      # escaso (droplet de 1 GB): dos arenas de malloc gastan poco pero se vuelven
      # un punto de contención en cuanto hay muchos hilos pidiendo memoria a la
      # vez. Con 8 hilos por worker se le da una arena a cada uno; cuesta ~150 MB
      # de fragmentación y aquí sobran diez gigas.
      MALLOC_ARENA_MAX: "8"

  la-gerencia:
    ports:
      - "8201:8001"
    restart: always
    environment:
      # La Gerencia es panel de configuración y mueve menos tráfico que El
      # Taller, pero es la que corre El Vigía: cinco paneles pidiendo cada 2-30 s,
      # y algunos hablan con el socket de Docker o con internet. Con 2 workers,
      # un sondeo lento a DigitalOcean podía dejar la pared esperando.
      # La pantalla de Ajustes → Rutas sondea si el mapa de bicicleta responde.
      OSRM_URL_BICI: "${OSRM_URL_BICI:-}"
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "8"
      MALLOC_ARENA_MAX: "8"

  # ── Postgres ────────────────────────────────────────────────────────────────
  # El compose base está tuneado para "droplet de 1 GB" (shared_buffers=64MB).
  # Esta máquina tiene 15 G y 8 núcleos, y el primer paso de la mudanza lo dejó a
  # medio camino (512 MB) por prudencia. Aquí ya va dimensionado de verdad:
  #
  #   shared_buffers 4G          Un techo, no una reserva: se llena perezosamente,
  #                              así que hoy Postgres usa ~90 MB porque la base
  #                              entera pesa 29 MB (agosto 2026) y ya está toda en
  #                              memoria. Subirlo NO acelera nada medible hoy —se
  #                              deja dicho para que nadie lo mida esperando otra
  #                              cosa— pero no cuesta nada y significa que la base
  #                              puede crecer cien veces sin volver a tocar esto.
  #   effective_cache_size 10G   tampoco reserva: le dice al planeador cuánta
  #                              memoria puede suponer en caché. Con 14.8 G en la
  #                              máquina y 4 G de colchón, 10 es la verdad.
  #   effective_cache_size 8G    no reserva nada: le dice al planeador cuánta
  #                              memoria puede suponer que el sistema tiene en
  #                              caché. Subirlo hace que prefiera índices sobre
  #                              recorridos de tabla completos.
  #   work_mem 32M               por operación de orden/agrupado. Ver la nota de
  #                              abajo: el peor caso teórico no es el real.
  #   random_page_cost 1.1       el default (4.0) asume disco que gira, donde
  #                              saltar es caro. Esto es SSD: saltar cuesta casi
  #                              lo mismo que leer seguido, y sin corregirlo el
  #                              planeador evita índices que sí conviene usar.
  #   effective_io_concurrency   un SSD atiende muchas lecturas a la vez; el
  #     200                      default (1) le dice que no puede.
  #   los max_parallel_*         dejan que UNA consulta grande use varios
  #                              núcleos. Es lo que aprovecha los 8 de verdad:
  #                              los reportes de Contaduría y los exports.
  postgres:
    command:
      - "postgres"
      # 2026-08-24: baja de 4 G a 2 G. El supuesto cambió — cuando se puso 4 G,
      # el NUC sólo cargaba El Despacho y la única regla era «que no haya que
      # volver en meses». Ahora entran Gotenberg, n8n, Paperless y OSRM: entre
      # los techos de aquí y de Redis había 7 G COMPROMETIDOS para una base de
      # 29 MB y una cola de 15 MB, y sumados a lo nuevo no cabían en 14.8 G.
      # 2 G siguen siendo setenta veces la base actual, así que no se pierde
      # nada real y se liberan 2 G de compromiso.
      - "-c"
      - "shared_buffers=2GB"
      # 32 MB por operación de orden o agrupado. El peor caso teórico con 200
      # conexiones asusta (6 G) pero no es el caso real: hay que tener 200
      # consultas ORDENANDO a la vez, y aquí el pico observado bajo esfuerzo fue
      # de ~25. Lo que compra: cuando la base tenga cien veces más filas, los
      # reportes de Contaduría y los exports ordenan EN MEMORIA en vez de escribir
      # archivos temporales al disco, que es donde una consulta pasa de medio
      # segundo a diez.
      - "-c"
      - "work_mem=32MB"
      - "-c"
      # Baja de 10 G a 7 G por lo mismo: no reserva nada, pero es lo que el
      # planeador SUPONE que el sistema tiene en caché. Con cuatro servicios
      # más ocupando memoria, decirle 10 G sería mentirle y lo llevaría a
      # elegir planes que no se sostienen.
      - "effective_cache_size=7GB"
      # Para VACUUM y CREATE INDEX. Sube a 1 G porque es lo que decide cuánto
      # tarda el mantenimiento cuando las tablas crecen, y corre de uno en uno.
      - "-c"
      - "maintenance_work_mem=1GB"
      # Pero el autovacuum se queda con su propio techo, más bajo: hereda de
      # `maintenance_work_mem` si no se fija, y con 4 procesos a 1 G cada uno
      # serían 4 G de golpe en segundo plano, sin que nadie lo pidiera.
      - "-c"
      - "autovacuum_work_mem=512MB"
      - "-c"
      - "autovacuum_max_workers=4"
      # Menos checkpoints cuando haya escritura sostenida. Es disco, no memoria,
      # pero es de lo mismo: dimensionar para el volumen que viene.
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "temp_buffers=32MB"
      - "-c"
      # 96 hilos entre las dos apps pueden pedir una conexión cada uno, más el
      # worker del Portavoz, los crons y algún psql: 100 se quedaba corto y
      # Postgres empieza a contestar «sorry, too many clients already». No cuesta
      # casi nada: lo que pesa por conexión es `work_mem`, y sólo cuando de verdad
      # ordena algo grande.
      - "max_connections=200"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_maintenance_workers=4"
    restart: always

  # ── Redis ───────────────────────────────────────────────────────────────────
  # El compose base pone techo de 64 MB con allkeys-lru "para que la cola del
  # Portavoz no crezca sin control". El efecto real es el contrario y es
  # peligroso: allkeys-lru puede desalojar la PROPIA cola (portavoz:cola no tiene
  # TTL), o sea perder eventos en silencio. Aquí: techo holgado y volatile-lru,
  # que solo desaloja lo que sí caduca (el caché de imágenes y las sesiones).
  redis:
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      # TECHO, no reserva: hoy Redis usa 15 MB. 2026-08-24 baja de 3 G a 1 G por
      # la misma razón que shared_buffers — sesenta veces lo que usa hoy sigue
      # siendo holgado, y los 2 G que libera hacen falta para los servicios
      # nuevos. Con `volatile-lru` sólo desaloja lo que tiene caducidad, así que
      # la cola del Portavoz nunca se pierde.
      - "1gb"
      - "--maxmemory-policy"
      - "volatile-lru"
    restart: always

  portavoz-worker:
    restart: always

  # ── El Mostrador ────────────────────────────────────────────────────────────
  # El Almacén guarda los medios en disco; El Mostrador los entrega. Existe porque
  # la mudanza separó las dos cosas que el diseño original tenía juntas: el disco
  # quedó aquí y El Portero en la ventana, así que las fotos necesitaban alguien
  # que las sirviera DE ESTE LADO. La ventana le hace reverse_proxy por el tailnet
  # (`UPSTREAM_MEDIOS`) y deja a El Taller como respaldo, de modo que si este
  # contenedor se cae las fotos siguen saliendo, sólo que por Django.
  #
  # Sólo monta `pub/` (los derivados JPEG/PNG que generamos nosotros). `orig/`, que
  # es lo que sube la gente, NO se monta: ésa es la frontera de seguridad.
  el-mostrador:
    image: caddy:2-alpine
    container_name: despacho-el-mostrador
    restart: always
    volumes:
      - ./infra/mostrador/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/media/pub:/srv/medios:ro
    environment:
      UPSTREAM_TALLER: "el-taller:8000"
    ports:
      - "8202:80"
    # Con la bitácora encendida, techo al archivo: las fotos son las peticiones
    # más numerosas del sistema y esta máquina tiene UN disco.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Por qué `restart: always` y no el `unless-stopped` del compose base ───────
# TRAMPA PAGADA EL 2026-08-21: `unless-stopped` NO levanta un contenedor que el
# demonio de Docker cree "detenido a mano", y ese marcador se lo cuelga CUALQUIER
# `docker kill` — incluso uno que solo manda un HUP y no mata nada. `optimizar.sh`
# hacía `docker compose kill -s HUP` cada 3 días sobre La Gerencia y El Taller: los
# dos seguían corriendo, pero quedaban marcados, y tras un apagón el demonio
# restauraba los otros tres y decía "done" sin un solo error en el journal. El
# sitio quedaba abajo hasta que alguien corriera `up -d` a mano.
#
# La causa ya está arreglada en optimizar.sh (el HUP se manda desde dentro del
# contenedor). Esto es el segundo candado: en ESTA máquina el requisito es que el
# sitio vuelva solo tras un corte de luz, así que reinicia pase lo que pase.
#
# El precio: si paras un servicio a propósito y la máquina reinicia, vuelve. Para
# apagar algo de verdad se usa su profile (como La Recepción) o
# `docker update --restart=no <contenedor>`.
