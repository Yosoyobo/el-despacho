name: El Mensajero

on:
  push:
    branches: [main]
    paths-ignore:
      # El job `actualizar_digests` empuja un commit al editar este archivo;
      # ignorarlo evita un bucle de CI.
      - "docker-compose.prod.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un solo deploy a la vez por rama: si llega un push nuevo mientras corre
# El Mensajero, se cancela el anterior para que no compitan dos despliegues
# sobre La Sede. cancel-in-progress aplica a runs que arranquen con esta
# config (los anteriores al cambio no quedan en el grupo).
concurrency:
  group: el-mensajero-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  pruebas:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # `-n auto` = un worker por núcleo del runner. Cada uno levanta su propia
      # base SQLite `:memory:`, así que las bases no se pisan, y la suite no tiene
      # tests con `transaction=True` que obliguen a serializar.
      #
      # `--dist loadfile` reparte por ARCHIVO, no por test, y eso NO es un detalle:
      # los tests marcados `redis` sí comparten estado real —los 4 de
      # `test_portavoz_worker.py` borran las mismas claves `COLA`/`DLQ` de la db 15,
      # y otro tanto hacen `test_ratelimit.py` y `test_aviso_deploy.py`—. Repartidos
      # por test podrían correr a la vez en workers distintos y pisarse; repartidos
      # por archivo es imposible por construcción. Cada archivo usa claves distintas
      # entre sí, así que agruparlos basta.
      #
      # El aislamiento del CACHÉ entre tests lo garantiza el fixture
      # `_cache_aislada` de conftest: sin él, repartir los tests distinto destapa
      # dependencias de orden que en serie quedan escondidas.
      - name: pytest
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q tests/ -n auto --dist loadfile

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .

  build:
    name: Build & push
    # Va ANTES del smoke test (antes iba después). El orden importa: así se
    # construye UNA vez y el smoke test prueba justo esa imagen, en lugar de
    # construir una copia aparte y dar verde sobre un artefacto que no viaja.
    # Nada llega al NUC sin pasar por el smoke: el deploy lo gatea
    # `actualizar_digests`, que ahora cuelga del smoke test.
    needs: [pruebas, lint]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: gerencia
            dockerfile: la-gerencia/Dockerfile
          - app: taller
            dockerfile: el-taller/Dockerfile
          - app: recepcion
            dockerfile: la-recepcion/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Owner en minúsculas (GHCR exige)
        id: lc
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # `:latest` es informativo — NADIE lo consume (verificado): el deploy va
          # anclado por digest desde `docker-compose.prod.yml`, que escribe
          # `actualizar_digests` DESPUÉS del smoke test. O sea que una imagen que
          # no pase el smoke puede quedar como `:latest` en GHCR, pero no se
          # despliega. Si algún día algo llega a depender de `:latest`, hay que
          # mover ese tag a `actualizar_digests`.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/el-despacho-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/el-despacho-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  smoke_docker:
    name: 🧪 Smoke test del stack en Docker
    needs: [build]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env mínimo
        run: |
          cat > .env <<EOF
          BOVEDA_MASTER_KEY=$(openssl rand -hex 32)
          DJANGO_SECRET_KEY=$(openssl rand -hex 32)
          POSTGRES_DB=el_despacho
          POSTGRES_USER=despacho
          POSTGRES_PASSWORD=$(openssl rand -hex 20)
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          REDIS_URL=redis://redis:6379/0
          GERENCIA_ALLOWED_HOSTS=localhost,127.0.0.1
          TALLER_ALLOWED_HOSTS=localhost,127.0.0.1
          RECEPCION_ALLOWED_HOSTS=localhost,127.0.0.1
          DESPACHO_SUPERADMIN_EMAIL=ci@example.com
          DESPACHO_SUPERADMIN_PASSWORD=$(openssl rand -hex 16)
          CADDY_HTTP_PORT=8080
          CADDY_HTTPS_PORT=8443
          DESPACHO_ENV=development
          EOF
          # `data/media` es El Almacén: el compose lo monta en las apps y su `pub/`
          # en El Portero, así que el smoke test ejerce la misma forma que producción.
          mkdir -p data/postgres data/redis data/caddy/data data/caddy/config data/credenciales \
                   data/media/orig data/media/pub
      # ANTES esto construía las imágenes AQUÍ, otra vez y sin caché. O sea que
      # el smoke test daba verde sobre unas imágenes y a producción viajaban
      # OTRAS —las del job `build`—; nunca se probaba el artefacto que ship*ea*.
      # Ahora se bajan las recién publicadas y se prueba exactamente eso.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apuntar el compose a las imágenes recién publicadas
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')
          sha='${{ github.sha }}'
          # Mismo patrón que docker-compose.prod.yml: fijar `image` y anular
          # `build` para que compose no intente reconstruir nada.
          cat > docker-compose.ci.yml <<EOF
          services:
            la-gerencia:
              image: ghcr.io/${owner}/el-despacho-gerencia:${sha}
              build: null
            el-taller:
              image: ghcr.io/${owner}/el-despacho-taller:${sha}
              build: null
            la-recepcion:
              image: ghcr.io/${owner}/el-despacho-recepcion:${sha}
              build: null
            portavoz-worker:
              image: ghcr.io/${owner}/el-despacho-gerencia:${sha}
              build: null
          EOF
      - name: Bajar las imágenes que se van a desplegar
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml pull la-gerencia el-taller la-recepcion
      - name: Levantar stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres redis
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml ps postgres | grep -q "healthy"; then break; fi
            sleep 2
          done
          if ! docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d la-gerencia el-taller la-recepcion portavoz-worker; then
            echo "❌ compose up -d falló — volcando logs de los containers que arrancaron"
            docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a
            for c in despacho-gerencia despacho-el-taller despacho-la-recepcion despacho-portavoz-worker; do
              echo "===== $c ====="
              docker logs "$c" --tail 200 2>&1 || echo "(no logs)"
            done
            exit 1
          fi
      - name: Esperar healthchecks (max 120s)
        run: |
          for i in $(seq 1 24); do
            sleep 5
            sg=$(docker inspect --format='{{.State.Health.Status}}' despacho-gerencia 2>/dev/null || echo "starting")
            st=$(docker inspect --format='{{.State.Health.Status}}' despacho-el-taller 2>/dev/null || echo "starting")
            sr=$(docker inspect --format='{{.State.Health.Status}}' despacho-la-recepcion 2>/dev/null || echo "starting")
            echo "[$i] gerencia=$sg taller=$st recepcion=$sr"
            if [ "$sg" = "healthy" ] && [ "$st" = "healthy" ] && [ "$sr" = "healthy" ]; then
              echo "✅ Las 3 apps healthy"
              exit 0
            fi
            if [ "$sg" = "unhealthy" ] || [ "$st" = "unhealthy" ] || [ "$sr" = "unhealthy" ]; then
              echo "❌ Algún container unhealthy" && break
            fi
          done
          echo "❌ Timeout esperando healthchecks"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 80 la-gerencia el-taller la-recepcion
          exit 1
      - name: Probar /ping en cada app
        run: |
          for entry in "despacho-gerencia:8001" "despacho-el-taller:8000" "despacho-la-recepcion:8002"; do
            name="${entry%:*}"; port="${entry##*:}"
            code=$(docker exec "$name" python -c "import urllib.request,sys;print(urllib.request.urlopen('http://localhost:'+'${port}'+'/ping',timeout=5).status)" 2>/dev/null || echo FAIL)
            echo "$name → $code"
            [ "$code" = "200" ] || { docker logs "$name" --tail 80; exit 1; }
          done
      - name: Apagar
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true

  actualizar_digests:
    name: Pin digests en docker-compose.prod.yml
    needs: [smoke_docker]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolver digests recién publicados
        id: digests
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')
          for app in gerencia taller recepcion; do
            ref="ghcr.io/${owner}/el-despacho-${app}:${{ github.sha }}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            echo "digest_$app=$digest" >> $GITHUB_OUTPUT
            echo "${app}: $digest"
          done
          echo "owner=$owner" >> $GITHUB_OUTPUT
      - name: Reescribir docker-compose.prod.yml
        run: |
          owner='${{ steps.digests.outputs.owner }}'
          dG='${{ steps.digests.outputs.digest_gerencia }}'
          dT='${{ steps.digests.outputs.digest_taller }}'
          dR='${{ steps.digests.outputs.digest_recepcion }}'
          cat > docker-compose.prod.yml <<EOF
          # Generado automáticamente por El Mensajero — NO editar a mano.
          # Cada push a main que cambie imágenes regenera este archivo.
          services:
            la-gerencia:
              image: ghcr.io/${owner}/el-despacho-gerencia@${dG}
              build: null
            el-taller:
              image: ghcr.io/${owner}/el-despacho-taller@${dT}
              build: null
            la-recepcion:
              image: ghcr.io/${owner}/el-despacho-recepcion@${dR}
              build: null
            portavoz-worker:
              image: ghcr.io/${owner}/el-despacho-gerencia@${dG}
              build: null
          EOF
      - name: Commit y push si hay cambios
        run: |
          git config user.name  "el-mensajero[bot]"
          git config user.email "el-mensajero@users.noreply.github.com"
          if git diff --quiet docker-compose.prod.yml; then
            echo "Sin cambios de digest."
            exit 0
          fi
          git add docker-compose.prod.yml
          git commit -m "ci(el-mensajero): pin digests $(echo '${{ github.sha }}' | cut -c1-7)"
          git push origin HEAD:main

  mudanza:
    name: 🚚 La Mudanza (deploy al NUC de Learning Center, con rollback automático)
    needs: [actualizar_digests]
    # El NUC sólo existe en el tailnet y el runner de GitHub es una máquina
    # desechable que NO está ahí. En vez de meterlo (que pedía una credencial
    # nueva), se salta por **La Sede**, que sí está en el tailnet y cuyos secretos
    # `SEDE_*` ya existían y estaban aprobados desde mayo. Cero secretos nuevos.
    #
    # La llave del salto (`~/.ssh/sede-nuc-deploy`) vive SÓLO en el Droplet y en
    # el NUC está autorizada con `from=` a la IP de La Sede en el tailnet: no
    # sirve desde ningún otro lugar. Nunca pasa por el repo ni por un chat.
    #
    # Antes esto entraba al tailnet con una credencial de Tailscale que nunca se
    # puso, así que el job salía VERDE sin desplegar nada durante días. Con esta
    # vía, si algo falla el job se pone ROJO — que es lo que uno quiere.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH a La Sede y deploy al NUC por el tailnet
        uses: appleboy/ssh-action@v1.2.0
        env:
          NUC_HOST: ${{ secrets.NUC_HOST }}
          NUC_USER: ${{ secrets.NUC_USER }}
          SHA: ${{ github.sha }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          host: ${{ secrets.SEDE_HOST }}
          username: ${{ secrets.SEDE_USER }}
          key: ${{ secrets.SEDE_SSH_KEY }}
          command_timeout: 20m
          envs: NUC_HOST,NUC_USER,SHA,CORRIDA
          script: |
            set -uo pipefail
            echo "=== La Sede → NUC ($NUC_HOST) por el tailnet ==="
            # La llave está acotada en el NUC con `command=`, así que lo que se
            # manda aquí NO se ejecuta: el NUC corre siempre su envoltorio
            # (~/bin/deploy-desde-sede.sh) y nada más. Se manda de todos modos un
            # texto con el commit y la corrida porque el envoltorio lo REGISTRA:
            # así la bitácora del NUC dice quién pidió cada deploy.
            #
            # Esto es lo que impide que comprometer La Sede —que está expuesta a
            # internet— sirva para algo más que disparar un deploy de lo que ya
            # está en main. Sin `command=`, esa llave daba shell como el usuario
            # del NUC, que tiene Docker: root efectivo.
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=15 -i ~/.ssh/sede-nuc-deploy \
                "$NUC_USER@$NUC_HOST" "deploy main $SHA · $CORRIDA"

  ventana:
    name: 🪟 La Ventana (Caddyfile y TLS en La Sede)
    needs: [actualizar_digests]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      # La ventana es un droplet con IP pública: el runner la alcanza directo, sin
      # tailnet. Corre UN contenedor (El Portero) y su única config es el Caddyfile.
      - name: SSH a La Sede y aplicar la ventana
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SEDE_HOST }}
          username: ${{ secrets.SEDE_USER }}
          key: ${{ secrets.SEDE_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/el-despacho

            echo "=== git fetch + reset main ==="
            git fetch origin main
            git reset --hard origin/main
            git rev-parse --short HEAD

            # VALIDAR ANTES DE APLICAR. Un Caddyfile inválido deja la ventana sin
            # arrancar, y con ella los cinco dominios: es el único punto donde un
            # error de sintaxis apaga todo. Las variables se pasan con valores de
            # relleno; solo se está comprobando la sintaxis.
            echo "=== Validando el Caddyfile ==="
            docker run --rm -v /opt/el-despacho/Caddyfile:/etc/caddy/Caddyfile:ro \
              -e UPSTREAM_TALLER=x:1 -e UPSTREAM_GERENCIA=x:1 \
              -e LANDING_ROOT=/srv/lc-fallback \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

            # RECREAR, no recargar: en Linux un bind-mount de UN ARCHIVO fija el
            # inode al crear el contenedor, y `git reset --hard` REEMPLAZA el
            # Caddyfile (rename → inode nuevo). El contenedor seguiría viendo el
            # archivo VIEJO y `caddy reload` reportaría éxito sin aplicar nada. Ya
            # pasó con el /salud de La Recepción.
            #
            # `--no-deps` porque El Portero declara depends_on de las apps, que
            # desde la mudanza ya no viven aquí.
            #
            # Los certificados viven en ./data/caddy/data: recrear NO los reemite.
            echo "=== Recreando El Portero ==="
            CF="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ventana.yml"
            docker compose $CF up -d --no-deps --force-recreate el-portero
            docker ps --format '{{.Names}}\t{{.Status}}'

      - name: 🚥 Smoke test de la cadena completa (DNS → ventana → tailnet → NUC)
        run: |
          set -uo pipefail
          # Este job corre EN PARALELO con La Mudanza, que en ese momento está
          # reiniciando las apps del NUC. Sin espera, el 502 de un contenedor a
          # medio arrancar pinta el deploy de rojo sin que nada esté roto — pasó
          # el 2026-08-25 y un rojo que no significa nada enseña a ignorarlos.
          # Así que se REINTENTA: lo que se prueba es que la cadena quede en pie,
          # no el instante exacto en que se probó.
          intento=1
          while :; do
            fallos=""
            # La homepage se sirve DESDE la ventana: tiene que dar 200 incluso si
            # el NUC está caído (es el requisito del failover).
            code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 12 https://learningcenter.mx/ || echo FAIL)
            [ "$code" = "200" ] || fallos="$fallos homepage=$code"
            # Las apps viven en el NUC: estas dos prueban ventana + tailnet + NUC.
            for h in gerencia taller; do
              code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 12 "https://$h.learningcenter.mx/ping" || echo FAIL)
              [ "$code" = "200" ] || fallos="$fallos $h=$code"
            done
            [ -z "$fallos" ] && break
            if [ "$intento" -ge 10 ]; then
              echo "❌ Falla la cadena tras $intento intentos:$fallos"
              exit 1
            fi
            echo "· intento $intento:$fallos — el NUC puede estar reiniciando; se reintenta en 20s"
            intento=$((intento + 1))
            sleep 20
          done
          echo "✅ Cadena completa verde: homepage en la ventana, apps en el NUC."
