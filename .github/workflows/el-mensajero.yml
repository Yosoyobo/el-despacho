name: El Mensajero

on:
  push:
    branches: [main]
    paths-ignore:
      # El job `actualizar_digests` empuja un commit al editar este archivo;
      # ignorarlo evita un bucle de CI.
      - "docker-compose.prod.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un solo deploy a la vez por rama: si llega un push nuevo mientras corre
# El Mensajero, se cancela el anterior para que no compitan dos despliegues
# sobre La Sede. cancel-in-progress aplica a runs que arranquen con esta
# config (los anteriores al cambio no quedan en el grupo).
concurrency:
  group: el-mensajero-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  pruebas:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q tests/

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .

  smoke_docker:
    name: 🧪 Smoke test del stack en Docker
    needs: [pruebas, lint]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env mínimo
        run: |
          cat > .env <<EOF
          BOVEDA_MASTER_KEY=$(openssl rand -hex 32)
          DJANGO_SECRET_KEY=$(openssl rand -hex 32)
          POSTGRES_DB=el_despacho
          POSTGRES_USER=despacho
          POSTGRES_PASSWORD=$(openssl rand -hex 20)
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          REDIS_URL=redis://redis:6379/0
          GERENCIA_ALLOWED_HOSTS=localhost,127.0.0.1
          TALLER_ALLOWED_HOSTS=localhost,127.0.0.1
          RECEPCION_ALLOWED_HOSTS=localhost,127.0.0.1
          DESPACHO_SUPERADMIN_EMAIL=ci@example.com
          DESPACHO_SUPERADMIN_PASSWORD=$(openssl rand -hex 16)
          CADDY_HTTP_PORT=8080
          CADDY_HTTPS_PORT=8443
          DESPACHO_ENV=development
          EOF
          # `data/media` es El Almacén: el compose lo monta en las apps y su `pub/`
          # en El Portero, así que el smoke test ejerce la misma forma que producción.
          mkdir -p data/postgres data/redis data/caddy/data data/caddy/config data/credenciales \
                   data/media/orig data/media/pub
      - name: Build local (sin push)
        run: docker compose -f docker-compose.yml build la-gerencia el-taller la-recepcion
      - name: Levantar stack
        run: |
          docker compose -f docker-compose.yml up -d postgres redis
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml ps postgres | grep -q "healthy"; then break; fi
            sleep 2
          done
          if ! docker compose -f docker-compose.yml up -d la-gerencia el-taller la-recepcion portavoz-worker; then
            echo "❌ compose up -d falló — volcando logs de los containers que arrancaron"
            docker compose -f docker-compose.yml ps -a
            for c in despacho-gerencia despacho-el-taller despacho-la-recepcion despacho-portavoz-worker; do
              echo "===== $c ====="
              docker logs "$c" --tail 200 2>&1 || echo "(no logs)"
            done
            exit 1
          fi
      - name: Esperar healthchecks (max 120s)
        run: |
          for i in $(seq 1 24); do
            sleep 5
            sg=$(docker inspect --format='{{.State.Health.Status}}' despacho-gerencia 2>/dev/null || echo "starting")
            st=$(docker inspect --format='{{.State.Health.Status}}' despacho-el-taller 2>/dev/null || echo "starting")
            sr=$(docker inspect --format='{{.State.Health.Status}}' despacho-la-recepcion 2>/dev/null || echo "starting")
            echo "[$i] gerencia=$sg taller=$st recepcion=$sr"
            if [ "$sg" = "healthy" ] && [ "$st" = "healthy" ] && [ "$sr" = "healthy" ]; then
              echo "✅ Las 3 apps healthy"
              exit 0
            fi
            if [ "$sg" = "unhealthy" ] || [ "$st" = "unhealthy" ] || [ "$sr" = "unhealthy" ]; then
              echo "❌ Algún container unhealthy" && break
            fi
          done
          echo "❌ Timeout esperando healthchecks"
          docker compose -f docker-compose.yml logs --tail 80 la-gerencia el-taller la-recepcion
          exit 1
      - name: Probar /ping en cada app
        run: |
          for entry in "despacho-gerencia:8001" "despacho-el-taller:8000" "despacho-la-recepcion:8002"; do
            name="${entry%:*}"; port="${entry##*:}"
            code=$(docker exec "$name" python -c "import urllib.request,sys;print(urllib.request.urlopen('http://localhost:'+'${port}'+'/ping',timeout=5).status)" 2>/dev/null || echo FAIL)
            echo "$name → $code"
            [ "$code" = "200" ] || { docker logs "$name" --tail 80; exit 1; }
          done
      - name: Apagar
        if: always()
        run: docker compose -f docker-compose.yml down -v || true

  build:
    name: Build & push
    needs: [smoke_docker]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: gerencia
            dockerfile: la-gerencia/Dockerfile
          - app: taller
            dockerfile: el-taller/Dockerfile
          - app: recepcion
            dockerfile: la-recepcion/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Owner en minúsculas (GHCR exige)
        id: lc
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/el-despacho-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/el-despacho-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  actualizar_digests:
    name: Pin digests en docker-compose.prod.yml
    needs: [build]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolver digests recién publicados
        id: digests
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')
          for app in gerencia taller recepcion; do
            ref="ghcr.io/${owner}/el-despacho-${app}:${{ github.sha }}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            echo "digest_$app=$digest" >> $GITHUB_OUTPUT
            echo "${app}: $digest"
          done
          echo "owner=$owner" >> $GITHUB_OUTPUT
      - name: Reescribir docker-compose.prod.yml
        run: |
          owner='${{ steps.digests.outputs.owner }}'
          dG='${{ steps.digests.outputs.digest_gerencia }}'
          dT='${{ steps.digests.outputs.digest_taller }}'
          dR='${{ steps.digests.outputs.digest_recepcion }}'
          cat > docker-compose.prod.yml <<EOF
          # Generado automáticamente por El Mensajero — NO editar a mano.
          # Cada push a main que cambie imágenes regenera este archivo.
          services:
            la-gerencia:
              image: ghcr.io/${owner}/el-despacho-gerencia@${dG}
              build: null
            el-taller:
              image: ghcr.io/${owner}/el-despacho-taller@${dT}
              build: null
            la-recepcion:
              image: ghcr.io/${owner}/el-despacho-recepcion@${dR}
              build: null
            portavoz-worker:
              image: ghcr.io/${owner}/el-despacho-gerencia@${dG}
              build: null
          EOF
      - name: Commit y push si hay cambios
        run: |
          git config user.name  "el-mensajero[bot]"
          git config user.email "el-mensajero@users.noreply.github.com"
          if git diff --quiet docker-compose.prod.yml; then
            echo "Sin cambios de digest."
            exit 0
          fi
          git add docker-compose.prod.yml
          git commit -m "ci(el-mensajero): pin digests $(echo '${{ github.sha }}' | cut -c1-7)"
          git push origin HEAD:main

  mudanza:
    name: 🚚 La Mudanza (deploy al NUC de Learning Center, con rollback automático)
    needs: [actualizar_digests]
    # Desde la mudanza del 2026-08-21 las apps viven en el NUC, que SOLO existe en
    # el tailnet: el runner de GitHub no lo alcanza sin entrar primero. La ventana
    # (La Sede) NO se usa como salto — es solo ventana, y su Caddyfile se despliega
    # en el job `ventana` de abajo.
    #
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      # OJO: el contexto `secrets` NO existe en el `if:` de un job — GitHub rechaza
      # el workflow ENTERO ("Unrecognized named-value: secrets") y la corrida muere
      # en 0 s sin ejecutar nada. Por eso la comprobación vive en un paso, que sí
      # puede leer secretos vía `env`. Así el deploy al NUC se SALTA mientras no
      # exista el cliente OAuth, en vez de fallar en rojo en cada push.
      - name: ¿Están los secretos del tailnet?
        id: creds
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        run: |
          if [ -n "${TS_ID:-}" ]; then
            echo "listo=si" >> "$GITHUB_OUTPUT"
          else
            echo "listo=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy al NUC omitido::Falta TS_OAUTH_CLIENT_ID. El deploy al NUC sigue siendo manual — ver docs/MUDANZA-AL-NUC-LC.md"
          fi

      - name: 🔌 Entrar al tailnet (nodo efímero; se va al terminar el job)
        if: steps.creds.outputs.listo == 'si'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH al NUC y deploy
        if: steps.creds.outputs.listo == 'si'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NUC_HOST }}
          username: ${{ secrets.NUC_USER }}
          key: ${{ secrets.NUC_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -uo pipefail
            cd /mnt/el-despacho

            echo "=== Capturando estado previo (rollback) ==="
            cp docker-compose.prod.yml docker-compose.prod.yml.previo
            COMMIT_PREVIO=$(git rev-parse HEAD)

            echo "=== git fetch + reset main ==="
            git fetch origin main
            git reset --hard origin/main
            COMMIT_NUEVO=$(git rev-parse HEAD)

            # Evaluar COMPOSE_FILES DESPUÉS del git reset — el site.yml puede
            # haber sido agregado/removido en el commit nuevo.
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
            if [ -f docker-compose.site.yml ]; then
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.site.yml"
            fi
            # El overlay del NUC saca a El Portero del stack (Caddy vive en la
            # ventana) y publica los puertos 8200/8201 que la ventana consume por
            # el tailnet. También sube el tuning de Postgres y Redis, que en el
            # compose base está calibrado para el droplet de 1 GB.
            if [ -f docker-compose.nuc.yml ]; then
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.nuc.yml"
            fi

            echo "=== docker compose pull ==="
            docker compose $COMPOSE_FILES pull

            echo "=== docker compose up -d ==="
            docker compose $COMPOSE_FILES up -d

            # El Caddyfile YA NO se aplica aquí. Desde la mudanza del 2026-08-21,
            # Caddy (El Portero) vive en la ventana y no en esta máquina; su
            # despliegue —con la validación previa y el truco del inode del
            # bind-mount de UN archivo— está en el job `ventana` de este mismo
            # workflow. Ver docs/MUDANZA-AL-NUC-LC.md.

            echo "=== Esperando 45s para healthchecks ==="
            sleep 45

            # Ventana amplia (~3 min). El motivo original era la PRIMERA emisión
            # de certs de Let's Encrypt, que ya no ocurre aquí: los certificados se
            # emiten en la ventana. Se conserva porque estas sondas atraviesan la
            # cadena COMPLETA (ventana → tailnet → NUC) y las apps de Django tardan
            # en arrancar tras migrate + collectstatic.
            echo "=== Validando healthchecks (10 intentos espaciados 15s) ==="
            DEPLOY_OK=1
            for intento in $(seq 1 10); do
              FALLOS=""
              for host in gerencia.learningcenter.mx taller.learningcenter.mx recepcion.learningcenter.mx; do
                CODE=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 8 \
                    "https://${host}/ping" || echo "FAIL")
                if [ "$CODE" != "200" ]; then
                  FALLOS="${FALLOS} ${host}=${CODE}"
                fi
              done
              if [ -z "$FALLOS" ]; then
                echo "✅ Healthcheck OK en intento $intento"
                DEPLOY_OK=0
                break
              fi
              echo "⚠️  Intento $intento falló:$FALLOS"
              if [ "$intento" -lt 10 ]; then sleep 15; fi
            done

            if [ "$DEPLOY_OK" -ne 0 ]; then
              echo "❌ Healthchecks fallaron tras 3 intentos. Iniciando rollback."
              echo "=== ps de los containers (estado pre-rollback) ==="
              docker compose $COMPOSE_FILES ps
              echo "=== logs de los containers Django (últimas 80 líneas, pre-rollback) ==="
              for svc in la-gerencia el-taller la-recepcion portavoz-worker; do
                echo "--- ${svc} ---"
                docker compose $COMPOSE_FILES logs --tail 80 --no-color "$svc" 2>&1 || true
              done
              mv docker-compose.prod.yml.previo docker-compose.prod.yml
              git reset --hard "$COMMIT_PREVIO"
              docker compose $COMPOSE_FILES pull
              docker compose $COMPOSE_FILES up -d
              sleep 30
              echo "=== Estado post-rollback ==="
              docker compose $COMPOSE_FILES ps
              docker compose $COMPOSE_FILES exec -T la-gerencia \
                python manage.py notificar_deploy --estado rollback --commit "$COMMIT_NUEVO" \
                --nota "Rollback automático tras fallo de healthcheck" \
                2>/dev/null || true
              exit 1
            fi

            rm -f docker-compose.prod.yml.previo

            # Sincroniza el crontab de La Sede desde infra/cron/el-despacho.cron
            # (idempotente, bloque gestionado). El repo ya está en el commit
            # nuevo por el `git reset --hard` de arriba. Best-effort: un fallo
            # de crontab no debe tumbar un deploy ya verde.
            echo "=== Sincronizando crons (infra/cron/el-despacho.cron) ==="
            bash infra/scripts/sync_crons.sh || echo "⚠️  sync de crons falló — revisar manualmente en La Sede"

            echo "=== Estado final ==="
            docker compose $COMPOSE_FILES ps
            docker compose $COMPOSE_FILES exec -T la-gerencia \
              python manage.py notificar_deploy --estado ok --commit "$COMMIT_NUEVO" \
              2>/dev/null || true

            # LC 2026-07: push global de Novedades ~1 min DESPUÉS de que la nueva
            # versión ya está viva (idempotente por NovedadAnunciada — solo dispara
            # si hay bloques de Novedades nuevos). Best-effort, no tumba el deploy.
            echo "=== Novedades: aviso global al equipo (en ~60s) ==="
            ( sleep 60 && docker compose $COMPOSE_FILES exec -T el-taller \
                python manage.py anunciar_novedades >> /var/log/novedades.log 2>&1 ) || true

            echo "✅ Deploy verde."

  ventana:
    name: 🪟 La Ventana (Caddyfile y TLS en La Sede)
    needs: [actualizar_digests]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      # La ventana es un droplet con IP pública: el runner la alcanza directo, sin
      # tailnet. Corre UN contenedor (El Portero) y su única config es el Caddyfile.
      - name: SSH a La Sede y aplicar la ventana
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SEDE_HOST }}
          username: ${{ secrets.SEDE_USER }}
          key: ${{ secrets.SEDE_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/el-despacho

            echo "=== git fetch + reset main ==="
            git fetch origin main
            git reset --hard origin/main
            git rev-parse --short HEAD

            # VALIDAR ANTES DE APLICAR. Un Caddyfile inválido deja la ventana sin
            # arrancar, y con ella los cinco dominios: es el único punto donde un
            # error de sintaxis apaga todo. Las variables se pasan con valores de
            # relleno; solo se está comprobando la sintaxis.
            echo "=== Validando el Caddyfile ==="
            docker run --rm -v /opt/el-despacho/Caddyfile:/etc/caddy/Caddyfile:ro \
              -e UPSTREAM_TALLER=x:1 -e UPSTREAM_GERENCIA=x:1 \
              -e LANDING_ROOT=/srv/lc-fallback \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

            # RECREAR, no recargar: en Linux un bind-mount de UN ARCHIVO fija el
            # inode al crear el contenedor, y `git reset --hard` REEMPLAZA el
            # Caddyfile (rename → inode nuevo). El contenedor seguiría viendo el
            # archivo VIEJO y `caddy reload` reportaría éxito sin aplicar nada. Ya
            # pasó con el /salud de La Recepción.
            #
            # `--no-deps` porque El Portero declara depends_on de las apps, que
            # desde la mudanza ya no viven aquí.
            #
            # Los certificados viven en ./data/caddy/data: recrear NO los reemite.
            echo "=== Recreando El Portero ==="
            CF="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ventana.yml"
            docker compose $CF up -d --no-deps --force-recreate el-portero
            docker ps --format '{{.Names}}\t{{.Status}}'

      - name: 🚥 Smoke test de la cadena completa (DNS → ventana → tailnet → NUC)
        run: |
          set -uo pipefail
          fallos=""
          # La homepage se sirve DESDE la ventana: tiene que dar 200 incluso si el
          # NUC está caído (es el requisito del failover).
          code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 12 https://learningcenter.mx/ || echo FAIL)
          [ "$code" = "200" ] || fallos="$fallos homepage=$code"
          # Las apps viven en el NUC: estas dos prueban ventana + tailnet + NUC.
          for h in gerencia taller; do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 12 "https://$h.learningcenter.mx/ping" || echo FAIL)
            [ "$code" = "200" ] || fallos="$fallos $h=$code"
          done
          if [ -n "$fallos" ]; then echo "❌ Falla la cadena:$fallos"; exit 1; fi
          echo "✅ Cadena completa verde: homepage en la ventana, apps en el NUC."
