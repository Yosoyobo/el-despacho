services:
  postgres:
    image: postgres:16-alpine
    container_name: despacho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # S-RAM-Wave1: tuning para droplet de 1 GB / 5 usuarios.
    # shared_buffers 128MB→64MB · work_mem 4MB→2MB · effective_cache_size 4GB→192MB
    # max_connections 100→20 (5 usuarios × ~3 conexiones por app = 15 holgado).
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "effective_cache_size=192MB"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "maintenance_work_mem=32MB"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: despacho-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    # S-RAM-Wave1: techo duro 64 MB con eviction LRU para que la cola del
    # Portavoz y rate-limit no crezcan sin control.
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--maxmemory", "64mb",
        "--maxmemory-policy", "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  la-gerencia:
    build:
      context: .
      dockerfile: la-gerencia/Dockerfile
    container_name: despacho-gerencia
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_APP: la_gerencia
      DJANGO_ALLOWED_HOSTS: ${GERENCIA_ALLOWED_HOSTS}
      # S-RAM-Wave1: glibc por defecto crea N arenas/CPU que pueden inflarse
      # con Python multithreaded. Cap a 2 ahorra ~100-200 MB de fragmentación.
      MALLOC_ARENA_MAX: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/credenciales:/data/credenciales
      - ./data/staticfiles-gerencia:/app/staticfiles
      # El Almacén (S-Medios-V1): los medios en disco. Es la fuente de
      # verdad para leer; Drive queda como espejo de la subida.
      - ./data/media:/app/medios
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8001/ping',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  el-taller:
    build:
      context: .
      dockerfile: el-taller/Dockerfile
    container_name: despacho-el-taller
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_APP: el_taller
      DJANGO_ALLOWED_HOSTS: ${TALLER_ALLOWED_HOSTS}
      MALLOC_ARENA_MAX: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      la-gerencia:
        condition: service_healthy  # serializa migrate de apps compartidas (cuentas, ajustes, buzon)
    volumes:
      - ./data/credenciales:/data/credenciales
      - ./data/staticfiles-taller:/app/staticfiles
      # El Almacén (S-Medios-V1): los medios en disco. Es la fuente de
      # verdad para leer; Drive queda como espejo de la subida.
      - ./data/media:/app/medios
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ping',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  la-recepcion:
    # El portal de clientes (S5, 2026-09-29). Encendido: sin ningún cliente
    # invitado nadie pasa de /entrar/. NO corre migrate (§14 Bug B): lee la misma
    # base y espera a que La Gerencia (la única que migra) esté sana.
    build:
      context: .
      dockerfile: la-recepcion/Dockerfile
    container_name: despacho-la-recepcion
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_APP: la_recepcion
      DJANGO_ALLOWED_HOSTS: ${RECEPCION_ALLOWED_HOSTS:-recepcion.learningcenter.mx,localhost,127.0.0.1}
      MALLOC_ARENA_MAX: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      la-gerencia:
        condition: service_healthy  # sus tablas las crea el migrate de La Gerencia
    volumes:
      - ./data/credenciales:/data/credenciales
      - ./data/staticfiles-recepcion:/app/staticfiles
      # El Almacén: aquí quedan los documentos que sube el cliente (comprobantes,
      # constancias, actas). La misma carpeta que El Taller, que los revisa.
      - ./data/media:/app/medios
    expose:
      - "8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8002/ping',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  portavoz-worker:
    build:
      context: .
      dockerfile: la-gerencia/Dockerfile
    container_name: despacho-portavoz-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_APP: la_gerencia
      MALLOC_ARENA_MAX: "2"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Bug B §14: el entrypoint corre migrate; serializar para evitar race
      # con la-gerencia sobre apps compartidas (cuentas, ajustes, buzon).
      la-gerencia:
        condition: service_healthy
    command: ["python", "-m", "lib.portavoz_worker"]

  el-portero:
    image: caddy:2-alpine
    container_name: despacho-el-portero
    restart: unless-stopped
    depends_on:
      la-gerencia:
        condition: service_healthy
      el-taller:
        condition: service_healthy
      la-recepcion:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/landing:/srv/landing:ro
      # Sólo `pub/` (derivados propios), NUNCA `orig/` — ver el snippet
      # `(medios)` del Caddyfile.
      - ./data/media/pub:/srv/medios:ro
      # La pantalla de mantenimiento (§4 #23), ver `(lc_failover)` del Caddyfile.
      # DIRECTORIOS, no archivos sueltos (§14 Bug F). La corta viene del repo; la
      # del roadmap la escribe y la borra el job `mudanza` en cada deploy.
      - ./infra/mantenimiento:/srv/mantenimiento:ro
      - ./data/caddy/mantenimiento:/srv/mantenimiento-vivo:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
